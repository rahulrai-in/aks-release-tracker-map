<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e3a5f" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)" />
    <rect width="1200" height="315" fill="url(#glow)" />

    <!-- Scattered color dots as subtle decoration -->
    <circle cx="180" cy="200" r="4" fill="#dc2626" opacity="0.4" />
    <circle cx="340" cy="160" r="3" fill="#ea580c" opacity="0.35" />
    <circle cx="500" cy="230" r="5" fill="#d97706" opacity="0.3" />
    <circle cx="650" cy="180" r="3" fill="#65a30d" opacity="0.35" />
    <circle cx="800" cy="210" r="4" fill="#16a34a" opacity="0.3" />
    <circle cx="950" cy="170" r="3" fill="#0d9488" opacity="0.35" />
    <circle cx="1050" cy="220" r="4" fill="#2563eb" opacity="0.3" />
    <circle cx="250" cy="400" r="3" fill="#7c3aed" opacity="0.3" />
    <circle cx="420" cy="380" r="4" fill="#22c55e" opacity="0.25" />
    <circle cx="750" cy="400" r="3" fill="#f59e0b" opacity="0.3" />
    <circle cx="900" cy="370" r="5" fill="#dc2626" opacity="0.2" />
    <circle cx="1020" cy="410" r="3" fill="#65a30d" opacity="0.25" />
    <circle cx="130" cy="310" r="3" fill="#0d9488" opacity="0.25" />
    <circle cx="580" cy="140" r="3" fill="#2563eb" opacity="0.25" />

    <!-- Title -->
    <text x="600" y="290" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="48"
        font-weight="700" fill="#ffffff" letter-spacing="-0.5">AKS Release Tracker</text>

    <!-- Subtitle -->
    <text x="600" y="340" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20"
        fill="#94a3b8" font-weight="400">Track Azure Kubernetes Service releases across every region</text>
</svg>