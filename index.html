<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AKS Release Tracker Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header / Controls ─── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      border-bottom: none;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(37, 99, 235, 0.15);
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      align-items: stretch;
      gap: 1px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 0;
      padding: 5px 12px;
      transition: background 0.15s;
    }

    .control-group:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .control-group label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      flex-shrink: 0;
    }

    select {
      background: transparent;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 3px 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    select option {
      background: #1e3a5f;
      color: #ffffff;
    }

    select:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    select:focus {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.2);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-latest {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }

    .badge-time {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
    }

    /* ─── Map ─── */
    #map {
      flex: 1;
      z-index: 1;
    }

    /* ─── Legend ─── */
    .legend {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.8;
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .legend-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── Summary bar ─── */
    .summary-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      flex-shrink: 0;
    }

    .summary-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .summary-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
    }

    /* ─── Popup overrides ─── */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #1e293b !important;
      border-radius: 8px !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12) !important;
    }

    .leaflet-popup-tip {
      background: #ffffff !important;
    }

    .leaflet-popup-content {
      margin: 12px 14px !important;
      font-size: 13px;
      line-height: 1.6;
    }

    .popup-region {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .popup-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .popup-label {
      color: #64748b;
    }

    .popup-value {
      font-weight: 500;
    }

    .popup-link {
      color: #2563eb;
      text-decoration: none;
    }

    .popup-link:hover {
      text-decoration: underline;
    }

    /* ─── Loading state ─── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 14px;
      color: #64748b;
    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: #ffffff;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 20px 28px;
      text-align: center;
      max-width: 400px;
    }

    .error-message h2 {
      color: #ef4444;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .error-message p {
      font-size: 13px;
      color: #64748b;
    }

    /* ─── Release Order Toggle ─── */
    .control-group.toggle-group {
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
      justify-content: center;
    }

    .toggle-group label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.55);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 34px;
      height: 18px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9px;
      transition: background 0.2s;
      cursor: pointer;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked+.toggle-slider {
      background: #22c55e;
    }

    .toggle-switch input:checked+.toggle-slider::before {
      transform: translateX(16px);
    }

    /* ─── Batch Number Labels ─── */
    .batch-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      line-height: 1;
    }

    /* ─── Release Order Panel ─── */
    .release-order-panel {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      max-height: 360px;
      width: 380px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.2s;
    }

    .release-order-panel.hidden {
      display: none;
    }

    .release-order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 10px 10px 0 0;
      flex-shrink: 0;
    }

    .release-order-header h3 {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin: 0;
    }

    .release-order-collapse {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      font-size: 16px;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1;
    }

    .release-order-collapse:hover {
      background: #e2e8f0;
    }

    .release-order-body {
      overflow-y: auto;
      padding: 6px 0;
    }

    .release-order-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .release-order-table th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      text-align: left;
      padding: 6px 12px;
      color: #64748b;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 1px solid #e2e8f0;
    }

    .release-order-table td {
      padding: 5px 12px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }

    .release-order-table tr:last-child td {
      border-bottom: none;
    }

    .release-order-table tr:hover td {
      background: #f1f5f9;
    }

    .release-order-table tr.highlighted td {
      background: #eff6ff;
    }

    .batch-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .batch-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      font-size: 11px;
    }

    .batch-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .batch-regions-list {
      color: #475569;
      line-height: 1.5;
    }

    .batch-regions-more {
      color: #2563eb;
      cursor: pointer;
      font-size: 11px;
    }

    .batch-regions-more:hover {
      text-decoration: underline;
    }

    /* ─── Responsive ─── */
    @media (max-width: 1100px) {
      .summary-bar {
        display: none;
      }
    }

    @media (max-width: 860px) {
      header {
        padding: 8px 12px;
        gap: 8px;
      }

      header h1 {
        font-size: 15px;
      }

      .controls {
        flex-direction: column;
        gap: 1px;
        width: 100%;
      }

      .control-group {
        width: 100%;
        flex: unset;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>AKS Release Tracker</h1>
    <div class="controls">
      <div class="control-group">
        <label for="section-select">Section</label>
        <select id="section-select"></select>
      </div>
      <div class="control-group">
        <label for="component-select">Component</label>
        <select id="component-select"></select>
      </div>
      <div class="control-group">
        <label for="version-select">Version</label>
        <select id="version-select"></select>
      </div>
      <div class="control-group toggle-group" onclick="document.getElementById('release-order-toggle').click()">
        <label for="release-order-toggle">Release Order</label>
        <span class="toggle-switch">
          <input type="checkbox" id="release-order-toggle" onclick="event.stopPropagation()" />
          <span class="toggle-slider"></span>
        </span>
      </div>
    </div>
    <div class="summary-bar" id="summary-bar"></div>
  </header>

  <div id="map"></div>

  <div class="release-order-panel hidden" id="release-order-panel">
    <div class="release-order-header">
      <h3>Release Order</h3>
      <button class="release-order-collapse" id="release-order-collapse" title="Collapse">&#x2715;</button>
    </div>
    <div class="release-order-body">
      <table class="release-order-table">
        <thead>
          <tr>
            <th>Order</th>
            <th>Regions</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="release-order-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading AKS release data&hellip;</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    /* ───────────────────────────────────────────────
       Azure Region → [lat, lng] mapping
       ─────────────────────────────────────────────── */
    const REGION_COORDS = {
      "Australia Central": [-35.31, 149.12],
      "Australia Central 2": [-35.31, 149.42],
      "Australia East": [-33.87, 151.21],
      "Australia Southeast": [-37.81, 144.96],
      "Austria East": [48.21, 16.37],
      "Belgium Central": [50.85, 4.35],
      "Brazil South": [-23.55, -46.63],
      "Brazil Southeast": [-22.91, -43.17],
      "Canada Central": [43.65, -79.38],
      "Canada East": [46.81, -71.21],
      "Central India": [18.52, 73.86],
      "Central US": [41.60, -93.61],
      "Chile Central": [-33.45, -70.67],
      "China East 2": [31.23, 121.47],
      "China East 3": [31.23, 121.87],

      "China North 3": [40.10, 116.81],
      "Denmark East": [55.68, 12.57],
      "East Asia": [22.32, 114.17],

      "East US 2": [36.67, -78.39],
      "East US 3": [37.55, -78.00],

      "France South": [43.60, 3.88],
      "Germany North": [53.55, 9.99],

      "Israel Central": [32.09, 34.78],
      "Israel Northwest": [32.79, 35.00],
      "Italy North": [45.46, 9.19],
      "Japan East": [35.68, 139.65],
      "Japan West": [34.69, 135.50],
      "Jio India Central": [21.15, 79.09],
      "Jio India West": [19.08, 72.88],
      "Korea Central": [37.57, 126.98],
      "Korea South": [35.18, 129.08],
      "Malaysia South": [1.50, 103.70],
      "Malaysia West": [3.14, 101.69],
      "Mexico Central": [19.43, -99.13],
      "New Zealand North": [-36.85, 174.76],
      "North Central US": [41.88, -87.63],
      "North Europe": [53.35, -6.26],
      "Northeast US 5": [42.36, -71.06],
      "Norway East": [59.91, 10.75],
      "Norway West": [58.97, 5.73],
      "Poland Central": [52.23, 21.01],
      "Qatar Central": [25.29, 51.53],
      "South Africa North": [-25.75, 28.23],
      "South Africa West": [-33.92, 18.42],
      "South Central US": [29.42, -98.49],
      "South Central US 2": [29.70, -97.80],
      "South India": [12.97, 80.15],
      "Southeast Asia": [1.35, 103.82],
      "Southeast US": [33.75, -84.39],
      "Southeast US 3": [33.45, -83.80],
      "Southeast US 5": [34.05, -84.60],
      "Southwest US": [36.17, -115.14],
      "Spain Central": [40.42, -3.70],
      "Sweden Central": [60.67, 17.14],
      "Sweden South": [55.60, 13.00],
      "Switzerland North": [47.45, 8.56],
      "Switzerland West": [46.20, 6.14],
      "Taiwan North": [25.03, 121.57],
      "Taiwan North West": [24.80, 120.97],
      "UAE Central": [24.45, 54.38],
      "UAE North": [25.20, 55.27],
      "UK South": [51.51, -0.13],
      "UK West": [51.48, -3.18],
      "US Gov Arizona": [33.45, -111.97],
      "US Gov Texas": [29.76, -95.37],
      "US Gov Virginia": [38.91, -77.50],
      "West Central US": [40.76, -111.89],
      "West Europe": [52.37, 4.90],
      "West US": [37.78, -122.42],
      "West US 2": [47.61, -122.33],
      "West US 3": [33.45, -112.07],
    };

    /* Pretty display names for sections */
    const SECTION_LABELS = {
      "RP": "Resource Provider",
      "UbuntuImage": "Ubuntu Image",
      "UbuntuSecurityPatch": "Ubuntu Security Patch",
      "CBLMarinerImage": "Azure Linux Image",
      "AzureLinuxSecurityPatch": "Azure Linux Security Patch",
      "WindowsImage": "Windows Image",
      "KubernetesSupportedVersions": "Kubernetes Supported Versions",
      "CVEStatus": "CVE Status",
    };

    /* Colors */
    const C_LATEST = "#22c55e"; // green
    const C_IN_PROGRESS = "#f59e0b"; // amber
    const C_OLDER = "#64748b"; // slate gray

    /* Batch sequence colour palette — warm→cool gradient for early→late */
    const BATCH_COLORS = [
      "#dc2626", // 1 – red
      "#ea580c", // 2 – orange
      "#d97706", // 3 – amber
      "#ca8a04", // 4 – yellow
      "#65a30d", // 5 – lime
      "#16a34a", // 6 – green
      "#0d9488", // 7 – teal
      "#2563eb", // 8 – blue
      "#7c3aed", // 9 – violet
    ];
    function batchColor(index) { return BATCH_COLORS[(index - 1) % BATCH_COLORS.length] || "#64748b"; }

    /* ───────────────────────────────────────────────
       App State
       ─────────────────────────────────────────────── */
    let appData = null;
    let map = null;
    let markersLayer = null;
    let legendControl = null;
    let releaseOrderLayer = null;
    let releaseOrderActive = false;

    /* ───────────────────────────────────────────────
       Initialise Leaflet Map
       ─────────────────────────────────────────────── */
    function initMap() {
      const mapContainer = document.getElementById("map");
      const containerWidth = mapContainer.clientWidth;
      const containerHeight = mapContainer.clientHeight;
      const minZoomW = Math.ceil(Math.log2(containerWidth / 256));
      const minZoomH = Math.ceil(Math.log2(containerHeight / 256));
      const computedMinZoom = Math.max(minZoomW, minZoomH, 2);

      const southWest = L.latLng(-85, -220);
      const northEast = L.latLng(85, 220);
      const bounds = L.latLngBounds(southWest, northEast);

      map = L.map("map", {
        center: [30, 10],
        zoom: computedMinZoom,
        minZoom: computedMinZoom,
        maxZoom: 10,
        maxBounds: bounds,
        maxBoundsViscosity: 1.0,
        worldCopyJump: false,
        zoomControl: true,
      });

      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 19,
        noWrap: true,
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      releaseOrderLayer = L.layerGroup().addTo(map);

      /* Legend */
      legendControl = L.control({ position: "bottomright" });
      legendControl.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `
      <div class="legend-title">Status</div>
      <div class="legend-item"><span class="legend-dot" style="background:${C_LATEST}"></span> Latest version</div>
      <div class="legend-item"><span class="legend-dot" style="background:${C_IN_PROGRESS}"></span> Rollout in progress</div>
      <div class="legend-item"><span class="legend-dot" style="background:${C_OLDER}"></span> Older version</div>
    `;
        return div;
      };
      legendControl.addTo(map);
    }

    /* ───────────────────────────────────────────────
       Data helpers
       ─────────────────────────────────────────────── */

    /** Collect all regions for a given section + component. Returns flat array. */
    function getRegions(sectionKey, componentKey) {
      const comp = appData.Sections[sectionKey]?.Components?.[componentKey];
      if (!comp?.RegionalStatuses) return [];
      return Object.values(comp.RegionalStatuses).flat();
    }

    /** Collect all unique version strings (Current + Recent) for a section/component, sorted descending. */
    function getVersions(regions) {
      const set = new Set();
      for (const r of regions) {
        if (r.Current?.Version) set.add(r.Current.Version);
        for (const h of r.Recent || []) {
          if (h.Version) set.add(h.Version);
        }
      }
      return [...set].sort().reverse();
    }

    /** Determine marker color for a region given the selected target version. */
    function regionColor(region, targetVersion) {
      if (region.InProgress) return C_IN_PROGRESS;
      if (region.Current?.Version === targetVersion) return C_LATEST;
      /* Compare lexicographically — works for AKS version formats */
      if (region.Current?.Version > targetVersion) return C_LATEST;
      return C_OLDER;
    }

    /* ───────────────────────────────────────────────
       Populate Selects
       ─────────────────────────────────────────────── */

    function populateSections() {
      const sel = document.getElementById("section-select");
      sel.innerHTML = "";
      const keys = Object.keys(appData.Sections).filter((k) => {
        const s = appData.Sections[k];
        return s.Components && Object.keys(s.Components).some(
          (c) => s.Components[c].RegionalStatuses && Object.keys(s.Components[c].RegionalStatuses).length > 0
        );
      });

      for (const key of keys) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = SECTION_LABELS[key] || key;
        sel.appendChild(opt);
      }

      /* Default to RP if available */
      if (keys.includes("RP")) sel.value = "RP";
    }

    function populateComponents() {
      const sectionKey = document.getElementById("section-select").value;
      const section = appData.Sections[sectionKey];
      const sel = document.getElementById("component-select");
      sel.innerHTML = "";

      if (!section?.Components) return;

      const compKeys = Object.keys(section.Components);
      for (const key of compKeys) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = key;
        sel.appendChild(opt);
      }

      /* Default to the section's DefaultComponent if present */
      if (section.DefaultComponent && compKeys.includes(section.DefaultComponent)) {
        sel.value = section.DefaultComponent;
      }
    }

    function populateVersions() {
      const sectionKey = document.getElementById("section-select").value;
      const componentKey = document.getElementById("component-select").value;
      const regions = getRegions(sectionKey, componentKey);
      const versions = getVersions(regions);
      const sel = document.getElementById("version-select");
      sel.innerHTML = "";

      for (const v of versions) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      }
    }

    /* ───────────────────────────────────────────────
       Render Map Markers
       ─────────────────────────────────────────────── */

    function render() {
      markersLayer.clearLayers();

      const sectionKey = document.getElementById("section-select").value;
      const componentKey = document.getElementById("component-select").value;
      const targetVersion = document.getElementById("version-select").value;
      const regions = getRegions(sectionKey, componentKey);

      let countLatest = 0;
      let countProgress = 0;
      let countOlder = 0;

      for (const region of regions) {
        const coords = REGION_COORDS[region.RegionName];
        if (!coords) continue;

        const color = regionColor(region, targetVersion);
        if (color === C_LATEST) countLatest++;
        else if (color === C_IN_PROGRESS) countProgress++;
        else countOlder++;

        const marker = L.circleMarker(coords, {
          radius: 7,
          fillColor: color,
          color: "#475569",
          weight: 1,
          opacity: 0.5,
          fillOpacity: 0.85,
        });

        marker.bindTooltip(region.RegionName, {
          direction: "top",
          offset: [0, -8],
          className: "",
        });

        /* Popup */
        const releaseNote = region.Current?.ReleaseNote;
        const noteLink = releaseNote
          ? `<a class="popup-link" href="${encodeURI(releaseNote)}" target="_blank" rel="noopener">Release Notes ↗</a>`
          : "—";

        const statusLabel =
          region.InProgress
            ? '<span style="color:#f59e0b">⟳ In Progress</span>'
            : color === C_LATEST
              ? '<span style="color:#22c55e">✓ Latest</span>'
              : '<span style="color:#64748b">▪ Older</span>';

        marker.bindPopup(`
      <div class="popup-region">${region.RegionName}</div>
      <div class="popup-row"><span class="popup-label">Version</span><span class="popup-value">${region.Current?.Version || "—"}</span></div>
      <div class="popup-row"><span class="popup-label">Status</span>${statusLabel}</div>
      <div class="popup-row"><span class="popup-label">Batch</span><span class="popup-value">${region.BatchIndex ?? "—"}</span></div>
      <div class="popup-row"><span class="popup-label">Notes</span>${noteLink}</div>
    `, { maxWidth: 300 });

        markersLayer.addLayer(marker);
      }

      /* Summary */
      const bar = document.getElementById("summary-bar");
      bar.innerHTML = `
    <span class="summary-stat"><span class="summary-dot" style="background:${C_LATEST}"></span>${countLatest} latest</span>
    <span class="summary-stat"><span class="summary-dot" style="background:${C_IN_PROGRESS}"></span>${countProgress} in progress</span>
    <span class="summary-stat"><span class="summary-dot" style="background:${C_OLDER}"></span>${countOlder} older</span>
    <span class="badge badge-time">Updated ${new Date(appData.LastUpdateTime).toLocaleString()}</span>
  `;

      /* Update release order overlay if active */
      renderReleaseOrder();
    }

    /* ───────────────────────────────────────────────
       Release Order Visualisation
       ─────────────────────────────────────────────── */

    /** Build batch data: { batchIndex → { regions[], centroid, status } } */
    function getBatchData(regions, targetVersion) {
      const batches = {};
      for (const region of regions) {
        const b = region.BatchIndex;
        if (b == null) continue;
        if (!batches[b]) batches[b] = { regions: [], allFinished: true, anyInProgress: false };
        batches[b].regions.push(region);
        if (region.InProgress) {
          batches[b].anyInProgress = true;
          batches[b].allFinished = false;
        } else {
          const color = regionColor(region, targetVersion);
          if (color !== C_LATEST) batches[b].allFinished = false;
        }
      }

      /* Compute centroid for each batch */
      for (const b of Object.keys(batches)) {
        let latSum = 0, lngSum = 0, count = 0;
        for (const r of batches[b].regions) {
          const c = REGION_COORDS[r.RegionName];
          if (c) { latSum += c[0]; lngSum += c[1]; count++; }
        }
        batches[b].centroid = count ? [latSum / count, lngSum / count] : null;
      }
      return batches;
    }

    /** Render batch number labels + flow arrows on the map */
    function renderReleaseOrder() {
      releaseOrderLayer.clearLayers();
      if (!releaseOrderActive) {
        document.getElementById("release-order-panel").classList.add("hidden");
        return;
      }

      const sectionKey = document.getElementById("section-select").value;
      const componentKey = document.getElementById("component-select").value;
      const targetVersion = document.getElementById("version-select").value;
      const regions = getRegions(sectionKey, componentKey);
      const batches = getBatchData(regions, targetVersion);
      const sortedKeys = Object.keys(batches).map(Number).sort((a, b) => a - b);

      /* Batch number labels on each region marker */
      for (const b of sortedKeys) {
        const bg = batchColor(b);
        for (const region of batches[b].regions) {
          const coords = REGION_COORDS[region.RegionName];
          if (!coords) continue;
          const label = L.marker(coords, {
            icon: L.divIcon({
              className: "",
              html: `<div class="batch-label" style="background:${bg}">${b}</div>`,
              iconSize: [22, 22],
              iconAnchor: [11, 11],
            }),
            interactive: false,
            zIndexOffset: 500,
          });
          releaseOrderLayer.addLayer(label);
        }
      }

      /* Populate the panel table */
      const tbody = document.getElementById("release-order-tbody");
      tbody.innerHTML = "";
      for (const b of sortedKeys) {
        const batch = batches[b];
        const regionNames = batch.regions.map(r => r.RegionName).sort();
        const maxShow = 3;
        let regionsHtml;
        if (regionNames.length <= maxShow) {
          regionsHtml = regionNames.join(", ");
        } else {
          const shown = regionNames.slice(0, maxShow).join(", ");
          const rest = regionNames.slice(maxShow);
          regionsHtml = `${shown} <span class="batch-regions-more" data-batch="${b}" onclick="this.parentElement.innerHTML=this.parentElement.getAttribute('data-full')">(+${rest.length} more)</span>`;
        }

        let statusColor, statusText;
        if (batch.anyInProgress) {
          statusColor = C_IN_PROGRESS; statusText = "In Progress";
        } else if (batch.allFinished) {
          statusColor = C_LATEST; statusText = "Finished";
        } else {
          statusColor = C_OLDER; statusText = "Pending";
        }

        const bg = batchColor(b);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="batch-num" style="background:${bg}">${b}</span></td>
          <td><span class="batch-regions-list" data-full="${regionNames.join(', ')}">${regionsHtml}</span></td>
          <td><span class="batch-status"><span class="batch-status-dot" style="background:${statusColor}"></span>${statusText}</span></td>
        `;

        /* Hover to highlight regions on the map */
        tr.addEventListener("mouseenter", () => {
          tr.classList.add("highlighted");
          for (const region of batch.regions) {
            const coords = REGION_COORDS[region.RegionName];
            if (!coords) continue;
            const highlight = L.circleMarker(coords, {
              radius: 14,
              fillColor: "#2563eb",
              color: "#2563eb",
              weight: 2,
              opacity: 0.6,
              fillOpacity: 0.15,
              className: "batch-highlight-" + b,
              interactive: false,
            });
            highlight._isBatchHighlight = true;
            releaseOrderLayer.addLayer(highlight);
          }
        });

        tr.addEventListener("mouseleave", () => {
          tr.classList.remove("highlighted");
          releaseOrderLayer.eachLayer(l => {
            if (l._isBatchHighlight) releaseOrderLayer.removeLayer(l);
          });
        });

        tbody.appendChild(tr);
      }

      document.getElementById("release-order-panel").classList.remove("hidden");
    }

    /* ───────────────────────────────────────────────
       Event Wiring
       ─────────────────────────────────────────────── */

    document.getElementById("section-select").addEventListener("change", () => {
      populateComponents();
      populateVersions();
      render();
    });

    document.getElementById("component-select").addEventListener("change", () => {
      populateVersions();
      render();
    });

    document.getElementById("version-select").addEventListener("change", () => {
      render();
    });

    document.getElementById("release-order-toggle").addEventListener("change", (e) => {
      releaseOrderActive = e.target.checked;
      renderReleaseOrder();
    });

    document.getElementById("release-order-collapse").addEventListener("click", () => {
      document.getElementById("release-order-toggle").checked = false;
      releaseOrderActive = false;
      renderReleaseOrder();
    });

    /* ───────────────────────────────────────────────
       Bootstrap
       ─────────────────────────────────────────────── */

    async function main() {
      try {
        initMap();
        const resp = await fetch("data/parsed_data.json");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        appData = await resp.json();

        populateSections();
        populateComponents();
        populateVersions();
        render();

        document.getElementById("loading").remove();

        /* Show user's location */
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            L.marker([latitude, longitude], {
              icon: L.divIcon({
                className: "",
                html: '<div style="position:relative;width:20px;height:20px;"><div style="position:absolute;inset:0;background:rgba(37,99,235,0.25);border-radius:50%;animation:pulse-ring 1.5s ease-out infinite;"></div><div style="position:absolute;top:4px;left:4px;width:12px;height:12px;background:#2563eb;border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(37,99,235,0.6);"></div></div><style>@keyframes pulse-ring{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}</style>',
                iconSize: [20, 20],
                iconAnchor: [10, 10],
              }),
              zIndexOffset: 1000,
            })
              .addTo(map)
              .bindTooltip("You are here", { direction: "top", offset: [0, -10] });
          });
        }
      } catch (err) {
        document.getElementById("loading").innerHTML = `
      <div class="error-message">
        <h2>Failed to load data</h2>
        <p>${err.message}. Please try refreshing the page.</p>
      </div>
    `;
      }
    }

    main();
  </script>
</body>
